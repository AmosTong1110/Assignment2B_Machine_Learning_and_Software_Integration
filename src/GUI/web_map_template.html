<!doctype html>
<!--
  Template for src/GUI/web_map.py.  __TITLE__ and __DATA__ are replaced by Python.
  Leaflet (map library) + OpenStreetMap tiles; leaflet-polylineoffset draws the two
  directions of a road side by side (like the Google Maps traffic layer).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylineoffset@1.1.1/leaflet.polylineoffset.js"></script>
<style>
  :root { --bg:#ffffff; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#1a73e8; --panel:#f9fafb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               color:var(--fg); background:var(--bg); }
  #app { display:flex; height:100%; }
  #side { width:360px; flex:none; overflow-y:auto; border-right:1px solid var(--line); background:var(--bg); }
  #map { flex:1; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0 0 4px; }
  .trip { display:grid; grid-template-columns:14px 1fr; gap:2px 8px; align-items:center; margin-top:6px; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .sub { color:var(--muted); font-size:12px; }
  section { padding:12px 16px; border-bottom:1px solid var(--line); }
  section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  .route { padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; cursor:pointer; }
  .route:hover { background:var(--panel); }
  .route.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .route .t { font-size:18px; font-weight:600; }
  .route .t small { font-size:13px; font-weight:400; color:var(--muted); margin-left:6px; }
  .route .rk { float:right; font-size:12px; color:var(--muted); }
  .route.best .t { color:#188038; }
  .delta { font-size:12px; margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:4px 3px; border-bottom:1px solid var(--line); }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .sw { display:inline-block; width:22px; height:5px; border-radius:3px; vertical-align:middle; margin-right:5px; }
  .legend div { margin:3px 0; font-size:12px; }
  #slider { width:100%; }
  .clock { display:flex; justify-content:space-between; align-items:baseline; }
  .clock b { font-size:20px; }
  label.tog { display:block; font-size:13px; margin:4px 0; }
  .note { font-size:11px; color:var(--muted); }
  .leaflet-popup-content { font-size:12px; }
  @media (max-width: 720px) {
    #app { flex-direction:column-reverse; }
    #side { width:100%; height:45%; border-right:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>TBRGS traffic map</h1>
      <div class="trip">
        <span class="dot" style="background:#188038"></span><span id="o"></span>
        <span class="dot" style="background:#d93025"></span><span id="d"></span>
      </div>
      <div class="sub" id="info" style="margin-top:6px"></div>
    </header>
    <section>
      <h2>Routes</h2>
      <div id="routes"></div>
    </section>
    <section id="timeBox">
      <h2>Predicted traffic</h2>
      <div class="clock"><b id="clock"></b><span class="sub" id="clockNote"></span></div>
      <input type="range" id="slider" min="0" max="0" step="1">
      <div class="sub" id="routeAtTime"></div>
    </section>
    <section>
      <h2>Selected route, step by step</h2>
      <table id="legs"></table>
    </section>
    <section class="legend">
      <h2>Legend</h2>
      <div><span class="sw" style="background:#1e8e3e"></span>Fast, ≥ 55 km/h</div>
      <div><span class="sw" style="background:#f9ab00"></span>Moderate, 45–55 km/h</div>
      <div><span class="sw" style="background:#e8453c"></span>Slow, 38–45 km/h</div>
      <div><span class="sw" style="background:#9b1c1c"></span>Near capacity, &lt; 38 km/h</div>
      <div><span class="sw" style="background:#1a73e8;height:7px"></span>Selected route</div>
      <label class="tog"><input type="checkbox" id="traffic" checked> Traffic layer</label>
      <label class="tog"><input type="checkbox" id="raw"> Show original SCATS positions</label>
      <p class="note" id="geoNote"></p>
    </section>
  </aside>
  <div id="map"></div>
</div>

<script>
const DATA = __DATA__;
const M = DATA.meta;

// ---------- helpers ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const road = s => esc(String(s).replace(/_/g, " "));
function speedColour(v) {
  if (v >= 55) return "#1e8e3e";
  if (v >= 45) return "#f9ab00";
  if (v >= 38) return "#e8453c";
  return "#9b1c1c";
}
const fmtMin = s => (s / 60).toFixed(1) + " min";

// ---------- header ----------
document.getElementById("o").innerHTML = `<b>${M.origin}</b> <span class="sub">${road(M.originLabel)}</span>`;
document.getElementById("d").innerHTML = `<b>${M.destination}</b> <span class="sub">${road(M.destinationLabel)}</span>`;
document.getElementById("info").textContent =
  `Leaving ${M.when} · ${M.model} prediction · ${M.method} · ${M.nodesCreated} search nodes`;
document.getElementById("geoNote").textContent =
  (M.corrected ? "Sites moved to the matching OpenStreetMap intersection. " :
                 "Run python -m src.Routing.osm_geometry to correct the SCATS positions. ") +
  (M.roadShapes ? "Links follow the real roads (OSRM)." : "Links drawn as straight lines.");

// ---------- map ----------
const map = L.map("map", { zoomControl: true, preferCanvas: false });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
map.createPane("routes").style.zIndex = 450;
map.createPane("traffic").style.zIndex = 420;

const siteById = Object.fromEntries(DATA.sites.map(s => [s.id, s]));
const bounds = L.latLngBounds(DATA.sites.map(s => [s.lat, s.lon]));
map.fitBounds(bounds.pad(0.05));

// Traffic layer: one line per DIRECTED edge, pushed to the left (Australia drives on the left).
const trafficLayer = L.layerGroup().addTo(map);
const edgeLines = DATA.edges.map((e, i) => {
  const line = L.polyline(e.coords, { pane: "traffic", weight: 5, opacity: 0.9, offset: -3,
                                      lineCap: "round", lineJoin: "round" });
  line.on("click", ev => edgePopup(i, ev.latlng));
  line.addTo(trafficLayer);
  return line;
});

let frame = 0, selected = 0;

function edgePopup(i, latlng) {
  const e = DATA.edges[i], f = DATA.frames[frame];
  L.popup().setLatLng(latlng).setContent(
    `<b>${road(e.road)}</b><br>${e.from} → ${e.to}<br>` +
    `${DATA.frames[frame].time}: ${f.flow[i]} veh/h → <b>${f.speed[i]} km/h</b><br>` +
    `Travel time ${f.tt[i]} s (incl. 30 s at the intersection)<br>` +
    `<span class="sub">straight ${e.km} km` + (e.road_km ? ` · by road ${e.road_km} km` : "") + `</span>`
  ).openOn(map);
}

function paintTraffic() {
  const f = DATA.frames[frame];
  edgeLines.forEach((line, i) => line.setStyle({ color: speedColour(f.speed[i]) }));
}

// Sites (corrected positions) and the raw SCATS positions with the shift drawn.
const siteLayer = L.layerGroup().addTo(map);
DATA.sites.forEach(s => {
  const isEnd = s.id === M.origin || s.id === M.destination;
  L.circleMarker([s.lat, s.lon], { radius: isEnd ? 8 : 4, weight: 2, color: "#fff",
      fillColor: s.id === M.origin ? "#188038" : s.id === M.destination ? "#d93025" : "#3c4043",
      fillOpacity: 1, pane: "markerPane" })
    .bindTooltip(`${s.id}`, { direction: "top", offset: [0, -4] })
    .bindPopup(`<b>SCATS ${s.id}</b><br>${road(s.label)}<br>` +
               `<span class="sub">${s.method === "unchanged" ? "SCATS position (no OSM match)"
                 : `moved ${s.offset} m to the OSM ${s.method === "intersection" ? "intersection" : "road"}`}</span>`)
    .addTo(siteLayer);
});
const rawLayer = L.layerGroup();
DATA.sites.filter(s => s.offset > 0).forEach(s => {
  L.polyline([[s.rawLat, s.rawLon], [s.lat, s.lon]], { color: "#7b1fa2", weight: 1.5, dashArray: "4 4" }).addTo(rawLayer);
  L.circleMarker([s.rawLat, s.rawLon], { radius: 4, color: "#7b1fa2", weight: 2, fillOpacity: 0.2 })
    .bindTooltip(`${s.id} SCATS position (${s.offset} m off)`).addTo(rawLayer);
});

// Routes
const routeLayer = L.layerGroup().addTo(map);
function routeCoords(r) {
  const pts = [];
  r.edges.forEach(i => { const c = DATA.edges[i].coords; pts.push(...(pts.length ? c.slice(1) : c)); });
  return pts;
}
function routeTimeAt(r, f) { return r.edges.reduce((s, i) => s + DATA.frames[f].tt[i], 0); }

function drawRoutes() {
  routeLayer.clearLayers();
  DATA.routes.forEach((r, idx) => {
    if (idx === selected) return;
    L.polyline(routeCoords(r), { pane: "routes", color: "#7baaf7", weight: 6, opacity: 0.75 })
      .on("click", () => selectRoute(idx)).addTo(routeLayer);
  });
  const r = DATA.routes[selected];
  if (!r) return;
  const pts = routeCoords(r);
  L.polyline(pts, { pane: "routes", color: "#174ea6", weight: 10, opacity: 0.9 }).addTo(routeLayer);
  L.polyline(pts, { pane: "routes", color: "#1a73e8", weight: 7, opacity: 1 }).addTo(routeLayer);
}

function renderRouteList() {
  const box = document.getElementById("routes");
  if (!DATA.routes.length) { box.innerHTML = '<p class="sub">No route found.</p>'; return; }
  const best = DATA.routes[0].minutes;
  box.innerHTML = DATA.routes.map((r, idx) => `
    <div class="route ${idx === selected ? "sel" : ""} ${idx === 0 ? "best" : ""}" data-i="${idx}">
      <span class="rk">Route ${r.rank}</span>
      <div class="t">${r.minutes.toFixed(1)} min<small>${r.km.toFixed(2)} km · ${r.path.length - 1} intersections</small></div>
      <div class="sub">via ${r.roads.map(road).join(", ")}</div>
      ${idx ? `<div class="delta sub">+${(r.minutes - best).toFixed(1)} min vs fastest</div>` : ""}
    </div>`).join("");
  box.querySelectorAll(".route").forEach(el => el.onclick = () => selectRoute(+el.dataset.i));
}

function renderLegs() {
  const r = DATA.routes[selected], t = document.getElementById("legs");
  if (!r) { t.innerHTML = ""; return; }
  const f = DATA.frames[frame];
  let total = 0;
  t.innerHTML = `<tr><th>From → To</th><th>Road</th><th class="n">km/h</th><th class="n">s</th></tr>` +
    r.edges.map(i => {
      const e = DATA.edges[i]; total += f.tt[i];
      return `<tr><td>${e.from} → ${e.to}</td><td><span class="sw" style="width:8px;background:${speedColour(f.speed[i])}"></span>${road(e.road)}</td>
              <td class="n">${f.speed[i].toFixed(0)}</td><td class="n">${f.tt[i].toFixed(0)}</td></tr>`;
    }).join("") +
    `<tr><th colspan="3">Total at ${f.time}</th><th class="n">${fmtMin(total)}</th></tr>`;
}

function renderClock() {
  const f = DATA.frames[frame], r = DATA.routes[selected];
  document.getElementById("clock").textContent = f.time;
  document.getElementById("clockNote").textContent = f.time === M.departure ? "departure time" : "";
  // at the departure time use the search's own total, so it matches the route card exactly
  const secs = r && f.time === M.departure ? r.minutes * 60 : r ? routeTimeAt(r, frame) : 0;
  document.getElementById("routeAtTime").textContent = r
    ? `Route ${r.rank} would take ${fmtMin(secs)} if you left at ${f.time}.` : "";
}

function selectRoute(idx) {
  selected = idx;
  renderRouteList(); drawRoutes(); renderLegs(); renderClock();
}

// Time slider
const slider = document.getElementById("slider");
slider.max = DATA.frames.length - 1;
frame = Math.max(0, DATA.frames.findIndex(f => f.time === M.departure));
slider.value = frame;
if (DATA.frames.length < 2) {
  document.getElementById("clockNote").textContent = "";
  slider.disabled = true;
  slider.title = "Run with --timeline (or the GUI map button) to predict every hour of the day";
}
slider.oninput = () => { frame = +slider.value; paintTraffic(); renderLegs(); renderClock(); };

document.getElementById("traffic").onchange = e => e.target.checked ? trafficLayer.addTo(map) : map.removeLayer(trafficLayer);
document.getElementById("raw").onchange = e => e.target.checked ? rawLayer.addTo(map) : map.removeLayer(rawLayer);

paintTraffic();
selectRoute(0);
if (DATA.routes.length) map.fitBounds(L.latLngBounds(routeCoords(DATA.routes[0])).pad(0.25));

// Optional view settings in the address, e.g.  map.html#time=17:00&route=2&raw=1&focus=2000&zoom=17
// (used by src/GUI/map_screenshots.py to make the report pictures)
const P = new URLSearchParams(location.hash.slice(1));
if (P.has("time")) {
  const i = DATA.frames.findIndex(f => f.time === P.get("time"));
  if (i >= 0) { slider.value = i; slider.oninput(); }
}
if (P.has("route")) selectRoute(Math.min(DATA.routes.length - 1, Math.max(0, +P.get("route") - 1)));
if (P.get("raw") === "1") { document.getElementById("raw").checked = true; rawLayer.addTo(map); }
if (P.get("traffic") === "0") { document.getElementById("traffic").checked = false; map.removeLayer(trafficLayer); }
if (P.get("panel") === "0") { document.getElementById("side").style.display = "none"; map.invalidateSize(); }
if (P.get("view") === "all") map.fitBounds(bounds.pad(0.05));
if (P.has("focus") && siteById[P.get("focus")]) {
  const s = siteById[P.get("focus")];
  map.setView([(s.lat + s.rawLat) / 2, (s.lon + s.rawLon) / 2], +(P.get("zoom") || 17));
}
</script>
</body>
</html>
